"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = false
command_timeout = 1000
scan_timeout = 30

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$nix_shell\
$line_break\
$character"""

right_format = """
$battery\
$status\
$cmd_duration"""

[character]
format = ' $symbol '
success_symbol = '[❯](bold white)'
error_symbol = '[❯](bold red)'
vimcmd_replace_one_symbol = '[❮](bold yellow)'
vimcmd_replace_symbol = '[❮](bold yellow)'
vimcmd_visual_symbol = '[❮](bold yellow)'

# Shows "hostname in ~/path" only when connected over SSH
[hostname]
ssh_only = true
ssh_symbol = ''
style = 'bold yellow'
format = '[$ssh_symbol$hostname]($style) [in](dimmed white) '
disabled = false

[directory]
style = 'bold white'
format = '[$path]($style) [$read_only]($read_only_style)'
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '…/'
home_symbol = '~'
read_only = '🔒'
read_only_style = 'bold red'
use_os_path_sep = true

[git_branch]
style = 'dimmed white'
format = '  [$symbol$branch(:$remote_branch)]($style)'
symbol = ' '
truncation_length = 25
truncation_symbol = '…'
only_attached = false
always_show_remote = false

[git_status]
style = 'dimmed white'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '=${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = 'x${count}'

# Shows when inside nix-shell, nix shell, or nix develop (shell.nix / flake.nix)
[nix_shell]
disabled = false
heuristic = true
style = 'bold blue'
symbol = '❄ '
impure_msg = 'nix'
pure_msg = 'nix pure'
unknown_msg = 'nix'
format = '  [$symbol$state( \($name\))]($style)'

[cmd_duration]
style = 'dimmed yellow'
min_time = 500
format = '[$duration]($style)  '
show_milliseconds = true
show_notifications = false

[status]
disabled = false
style = 'bold red'
format = '[$symbol$status]($style)  '
symbol = '✘ '
success_symbol = ''
not_executable_symbol = '🚫'
not_found_symbol = '❓'
sigint_symbol = '🛑'
signal_symbol = '⚡'
map_symbol = false

[battery]
disabled = false
format = '[$symbol$percentage]($style)  '

[[battery.display]]
threshold = 20
style = 'bold red'

[[battery.display]]
threshold = 50
style = 'dimmed yellow'

[[battery.display]]
threshold = 100
style = 'dimmed white'

[nodejs]
style = 'dimmed white'
symbol = ' '
format = '[$symbol$version]($style)  '

[python]
style = 'dimmed white'
symbol = ' '
format = '[$symbol$version( \($virtualenv\))]($style)  '

[rust]
style = 'dimmed white'
symbol = ' '
format = '[$symbol$version]($style)  '

[golang]
style = 'dimmed white'
symbol = ' '
format = '[$symbol$version]($style)  '

[docker_context]
style = 'dimmed white'
symbol = ' '
format = '[$symbol$context]($style)  '

[kubernetes]
style = 'dimmed white'
symbol = '☸ '
format = '[$symbol$context( \($namespace\))]($style)  '
disabled = false

[jobs]
style = 'dimmed yellow'
symbol = '⚙ '
number_threshold = 1
format = '[$symbol$number]($style)  '

